<!-- ═══════════════════════════════════════════════════════════
     IMPORT DATA — SI-DEVA v3.0
     Tab: CSV · JSON · Sample Data
     ═══════════════════════════════════════════════════════════ -->

<div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">📥 Import Data CSV / JSON</div>
    </div>

    <div class="card-body">

      <!-- ── TAB NAVIGATION ──────────────────────────────── -->
      <div class="tabs"
        style="border-bottom:1px solid var(--border);margin-bottom:16px;">
        <button class="tab-btn active" onclick="showTab('tab-import-csv')">CSV</button>
        <button class="tab-btn"        onclick="showTab('tab-import-json')">JSON</button>
        <button class="tab-btn"        onclick="showTab('tab-import-sample')">Load Sample Data</button>
      </div>

      <!-- ── TAB: IMPORT CSV ─────────────────────────────── -->
      <div class="tab-pane active" id="tab-import-csv">

        <div class="form-group">
          <label>Pilih Tabel Target</label>
          <select class="form-control" id="import-csv-target">
            <option value="paket">Data Paket</option>
            <option value="rincian">Rincian Belanja</option>
            <option value="harga">Survey Harga</option>
            <option value="penyedia">Data Penyedia</option>
          </select>
        </div>

        <div class="form-group mt-16">
          <label>Upload File CSV</label>
          <input type="file" accept=".csv" id="csv-file" class="form-control">
        </div>

        <div style="margin-top:12px;">
          <button class="btn btn-primary" onclick="importCSV()">Import CSV</button>
        </div>

        <!-- Petunjuk format kolom -->
        <div class="mt-16"
          style="background:var(--surface3);border-radius:var(--radius);padding:12px;">
          <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;">
            Format CSV yang diperlukan:
          </div>
          <div id="csv-format-hint" style="font-size:11px;color:var(--text3);">
            Pilih tabel untuk melihat format kolom yang diperlukan.
          </div>
        </div>

      </div>

      <!-- ── TAB: IMPORT JSON ────────────────────────────── -->
      <div class="tab-pane" id="tab-import-json">

        <div class="form-group">
          <label>Pilih Tabel Target</label>
          <select class="form-control" id="import-json-target">
            <option value="paket">Data Paket</option>
            <option value="rincian">Rincian Belanja</option>
            <option value="harga">Survey Harga</option>
            <option value="penyedia">Data Penyedia</option>
          </select>
        </div>

        <div class="form-group mt-16">
          <label>Upload File JSON</label>
          <input type="file" accept=".json" id="json-file" class="form-control">
        </div>

        <div style="margin-top:12px;">
          <button class="btn btn-primary" onclick="importJSON()">Import JSON</button>
        </div>

      </div>

      <!-- ── TAB: SAMPLE DATA ────────────────────────────── -->
      <div class="tab-pane" id="tab-import-sample">
        <p style="color:var(--text2);font-size:13px;margin-bottom:16px;">
          Muat data contoh berdasarkan file SI_DEVA.xlsm untuk mencoba aplikasi.
        </p>
        <button class="btn btn-success" onclick="loadSampleData()">🎲 Muat Sample Data</button>
        <p class="form-hint mt-8">
          Catatan: Akan menggantikan data yang ada. Pastikan backup terlebih dahulu.
        </p>
      </div>

    </div>
  </div>
</div>
