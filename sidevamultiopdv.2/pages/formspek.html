<!-- ═══════════════════════════════════════════════════════════
     FORM SPEK — Spesifikasi Teknis Paket E-Purchasing
     Header: Filter (PPK · RUP) · TTD/Cap · Aksi · Zoom
     ═══════════════════════════════════════════════════════════ -->

<div class="card" style="overflow:visible;">

  <!-- ── CARD HEADER ────────────────────────────────────────── -->
  <div class="card-header">
    <div class="card-title">🧷 Form Spek - Spesifikasi Teknis Paket E-Purchasing</div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">

      <!-- Filter: PPK & RUP -->
      <select class="filter-select" id="formspek-pejabat-select" onchange="loadFormSpekData()"
        title="Pilih PPK">
        <option value="">-- Pilih PPK --</option>
      </select>
      <select class="filter-select" id="formspek-rup-select" onchange="loadFormSpekData()">
        <option value="">-- Pilih No RUP --</option>
      </select>

      <!-- Toggle TTD / Cap / Tata Letak -->
      <button id="formspek-ttd-toggle" onclick="toggleTtdOnly('formspek')"
        class="btn btn-secondary btn-sm"
        title="Klik untuk sertakan/tidak scan TTD di dokumen"
        style="gap:5px;">
        🖊 Tanpa TTD
      </button>
      <button id="formspek-cap-toggle" onclick="toggleCapOnly('formspek')"
        class="btn btn-secondary btn-sm"
        title="Klik untuk sertakan/tidak cap/stempel di dokumen"
        style="gap:5px;">
        🔴 Tanpa Cap
      </button>
      <button id="formspek-layout-btn" onclick="openLayoutPanel('formspek')"
        class="btn btn-secondary btn-sm"
        title="Atur posisi TTD &amp; Cap"
        style="display:none;">
        ⚙️ Tata Letak TTD
      </button>

      <!-- Aksi: Cetak · PDF · Margin -->
      <button class="btn btn-primary" onclick="printFormSpek()">🖨️ Cetak</button>
      <button class="btn-pdf" onclick="saveToPDF('formspek')"
        title="Buka dokumen siap simpan sebagai PDF">
        📄 PDF
      </button>
      <button class="btn" onclick="openMarginDialog('formspek','Form Spek')"
        title="Atur margin cetak"
        style="background:#f3f4f6; color:#111; border:1px solid #d0d7de;">
        ⚙️ Margin
      </button>

      <!-- Zoom: Preview -->
      <div style="display:flex; align-items:center; gap:4px;
                  border-left:1px solid #d0d7de; padding-left:8px; margin-left:2px;">
        <button onclick="docZoom('formspek',-10)" title="Perkecil"
          style="width:28px; height:28px; border-radius:6px; border:1px solid #d0d7de;
                 background:#f3f4f6; color:#111; font-size:15px; cursor:pointer;
                 display:flex; align-items:center; justify-content:center;">
          −
        </button>
        <span id="formspek-zoom-label"
          style="font-size:11px; font-weight:600; color:#374151;
                 min-width:34px; text-align:center;">
          100%
        </span>
        <button onclick="docZoom('formspek',10)" title="Perbesar"
          style="width:28px; height:28px; border-radius:6px; border:1px solid #d0d7de;
                 background:#f3f4f6; color:#111; font-size:15px; cursor:pointer;
                 display:flex; align-items:center; justify-content:center;">
          +
        </button>
        <button onclick="docZoomReset('formspek')" title="Reset zoom"
          style="height:28px; padding:0 7px; border-radius:6px; border:1px solid #d0d7de;
                 background:#f3f4f6; color:#111; font-size:11px; font-weight:600;
                 cursor:pointer;">
          Reset
        </button>
      </div>

    </div>
  </div>

  <!-- ── CARD BODY ──────────────────────────────────────────── -->
  <div class="card-body" id="formspek-content" style="overflow-x:auto; padding:0;">
    <div class="empty-state">
      <div class="empty-icon">🧷</div>
      <div class="empty-title">Pilih No RUP</div>
      <div class="empty-sub">
        Pilih nomor RUP di atas untuk menampilkan Spesifikasi Teknis Paket E-Purchasing
      </div>
    </div>
  </div>

</div>
