<!-- ═══════════════════════════════════════════════════════════
     SPPBJ — Surat Perintah Pengadaan Barang/Jasa
     Header: Filter (PPK · RUP) · TTD/Cap Toggle · Aksi · Zoom
     ═══════════════════════════════════════════════════════════ -->

<div class="card" style="overflow:visible;">

  <!-- ── CARD HEADER ────────────────────────────────────────── -->
  <div class="card-header"
    style="flex-direction:column; align-items:flex-start; gap:14px; padding:20px 24px;">

    <div class="card-title"
      style="font-size:15px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif;">
      📨 SPPBJ — Surat Perintah Pengadaan Barang/Jasa
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; width:100%;">

      <!-- Filter: PPK / PPKom -->
      <div style="display:flex; flex-direction:column; gap:4px; flex:1; min-width:180px;">
        <span style="font-size:11px; font-weight:600; color:var(--text3);
                     text-transform:uppercase; letter-spacing:0.5px;
                     font-family:'Plus Jakarta Sans',sans-serif;">
          PPK / PPKom
        </span>
        <select class="filter-select" id="sppbj-ppk-select" onchange="scheduleLoadSppbjData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih PPKom —</option>
        </select>
      </div>

      <!-- Filter: Nomor RUP -->
      <div style="display:flex; flex-direction:column; gap:4px; flex:1; min-width:160px;">
        <span style="font-size:11px; font-weight:600; color:var(--text3);
                     text-transform:uppercase; letter-spacing:0.5px;
                     font-family:'Plus Jakarta Sans',sans-serif;">
          Nomor RUP
        </span>
        <select class="filter-select" id="sppbj-rup-select" onchange="scheduleLoadSppbjData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih No RUP —</option>
        </select>
      </div>

      <!-- Aksi: TTD · Cap · Layout · Cetak · PDF · Margin -->
      <div style="display:flex; flex-direction:column; gap:4px; justify-content:flex-end;">
        <span style="font-size:11px; font-weight:600; color:transparent;
                     text-transform:uppercase; letter-spacing:0.5px;">
          ‎
        </span>
        <button id="sppbj-ttd-toggle" onclick="toggleTtdOnly('sppbj')"
          class="btn btn-secondary btn-sm"
          title="Klik untuk sertakan/tidak scan TTD di dokumen"
          style="gap:5px;">
          🖊 Tanpa TTD
        </button>
        <button id="sppbj-cap-toggle" onclick="toggleCapOnly('sppbj')"
          class="btn btn-secondary btn-sm"
          title="Klik untuk sertakan/tidak cap/stempel di dokumen"
          style="gap:5px;">
          🔴 Tanpa Cap
        </button>
        <button id="sppbj-layout-btn" onclick="openLayoutPanel('sppbj')"
          class="btn btn-secondary btn-sm"
          title="Atur posisi TTD &amp; Cap"
          style="display:none;">
          ⚙️ Tata Letak TTD
        </button>
        <button class="btn btn-primary" onclick="printSppbj()"
          style="font-family:'Plus Jakarta Sans',sans-serif;
                 font-size:13px; white-space:nowrap;">
          🖨️ Cetak
        </button>
        <button class="btn-pdf" onclick="saveToPDF('sppbj')"
          title="Buka dokumen siap simpan sebagai PDF">
          📄 PDF
        </button>
        <button class="btn" onclick="openMarginDialog('sppbj','SPPBJ')"
          title="Atur margin cetak"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;
                 white-space:nowrap; background:#f3f4f6; color:#111; border:1px solid #d0d7de;">
          ⚙️ Margin
        </button>
      </div>

      <!-- Zoom: Preview -->
      <div style="display:flex; flex-direction:column; gap:4px; justify-content:flex-end;">
        <span style="font-size:11px; font-weight:600; color:var(--text3);
                     text-transform:uppercase; letter-spacing:0.5px;
                     font-family:'Plus Jakarta Sans',sans-serif;">
          Zoom Preview
        </span>
        <div style="display:flex; align-items:center; gap:4px;">
          <button onclick="docZoom('sppbj',-10)" title="Perkecil"
            style="width:30px; height:30px; border-radius:6px; border:1px solid #d0d7de;
                   background:#f3f4f6; color:#111; font-size:16px; cursor:pointer;
                   display:flex; align-items:center; justify-content:center; line-height:1;">
            −
          </button>
          <span id="sppbj-zoom-label"
            style="font-size:12px; font-weight:600; color:#374151;
                   min-width:38px; text-align:center;
                   font-family:'Plus Jakarta Sans',sans-serif;">
            100%
          </span>
          <button onclick="docZoom('sppbj',10)" title="Perbesar"
            style="width:30px; height:30px; border-radius:6px; border:1px solid #d0d7de;
                   background:#f3f4f6; color:#111; font-size:16px; cursor:pointer;
                   display:flex; align-items:center; justify-content:center; line-height:1;">
            +
          </button>
          <button onclick="docZoomReset('sppbj')" title="Reset zoom"
            style="height:30px; padding:0 8px; border-radius:6px; border:1px solid #d0d7de;
                   background:#f3f4f6; color:#111; font-size:11px; font-weight:600;
                   cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;">
            Reset
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── CARD BODY ──────────────────────────────────────────── -->
  <div class="card-body" id="sppbj-content" style="overflow-x:auto; padding:0;">
    <div class="empty-state">
      <div class="empty-icon">📨</div>
      <div class="empty-title" style="font-family:'Plus Jakarta Sans',sans-serif;">Pilih No RUP</div>
      <div class="empty-sub" style="font-family:'Plus Jakarta Sans',sans-serif;">
        Pilih PPKom dan No RUP untuk menampilkan
        Surat Perintah Pengadaan Barang/Jasa
      </div>
    </div>
  </div>

</div>
