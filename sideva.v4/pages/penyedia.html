<!-- ═══════════════════════════════════════════════════════════
     DATA REFERENSI PENYEDIA — SI-DEVA v3.0
     ═══════════════════════════════════════════════════════════ -->

<div class="table-container">

  <!-- ── HEADER: Judul + Filter + Cari ──────────────────────── -->
  <div class="table-header">
    <div class="table-header-title">🏪 Data Referensi Penyedia</div>
    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-penyedia"
          placeholder="Cari penyedia, alamat…"
          oninput="filterPenyedia()">
      </div>
      <select class="filter-select" id="filter-tipe-penyedia" onchange="filterPenyedia()">
        <option value="">Semua Tipe</option>
        <option value="UMKM">UMKM</option>
        <option value="Non-UMKM">Non-UMKM</option>
      </select>
    </div>
  </div>

  <!-- ── TABEL ───────────────────────────────────────────────── -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="no-col" onclick="sortTable('penyedia','no')">No</th>
          <th onclick="sortTable('penyedia','namaPenyedia')">Nama Penyedia</th>
          <th onclick="sortTable('penyedia','alamat')">Alamat</th>
          <th onclick="sortTable('penyedia','bentukUsaha')">Bentuk Usaha</th>
          <th onclick="sortTable('penyedia','status')">Status</th>
          <th onclick="sortTable('penyedia','tipe')">Tipe</th>
          <th>Link</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tbody-penyedia"></tbody>
    </table>
  </div>

  <!-- ── FOOTER: Info + Paginasi ────────────────────────────── -->
  <div class="table-footer">
    <div class="table-info" id="info-penyedia"></div>
    <div class="pagination" id="pag-penyedia"></div>
  </div>

</div>
