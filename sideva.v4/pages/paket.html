<!-- ═══════════════════════════════════════════════════════════
     DATA PAKET PENGADAAN — SI-DEVA v3.0
     ═══════════════════════════════════════════════════════════ -->

<div class="table-container">

  <!-- ── HEADER: Judul + Filter + Cari ──────────────────────── -->
  <div class="table-header">
    <div class="table-header-title">📦 Data Paket Pengadaan</div>
    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-paket"
          placeholder="Cari nama paket, RUP…"
          oninput="filterPaket()">
      </div>
      <select class="filter-select" id="filter-rup-paket" onchange="filterPaket()">
        <option value="">Semua No RUP</option>
      </select>
      <select class="filter-select" id="filter-bidang-paket" onchange="filterPaket()">
        <option value="">Semua Bidang</option>
      </select>
      <select class="filter-select" id="filter-rek-paket" onchange="filterPaket()">
        <option value="">Semua Rekening</option>
      </select>
    </div>
  </div>

  <!-- ── TABEL ───────────────────────────────────────────────── -->
  <div class="table-wrap">
    <table>
      <thead id="thead-paket">
        <tr>
          <th class="no-col"              onclick="sortTable('paket','noPaket')">No</th>
          <th                             onclick="sortTable('paket','namaPaket')">Nama Paket</th>
          <th                             onclick="sortTable('paket','rup')">RUP</th>
          <th                             onclick="sortTable('paket','bidang')">Bidang</th>
          <th                             onclick="sortTable('paket','paguAnggaran')">Pagu (Rp)</th>
          <th                             onclick="sortTable('paket','masaKerja')">Masa</th>
          <th                             onclick="sortTable('paket','tanggalPesanan')">Tgl Pesanan</th>
          <th                             onclick="sortTable('paket','tanggalSelesai')">Tgl Selesai</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tbody-paket"></tbody>
    </table>
  </div>

  <!-- ── FOOTER: Info + Paginasi ────────────────────────────── -->
  <div class="table-footer">
    <div class="table-info" id="info-paket"></div>
    <div class="pagination" id="pag-paket"></div>
  </div>

</div>
