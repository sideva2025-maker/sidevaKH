<!-- ═══════════════════════════════════════════════════════════
     EV_HP — Berita Acara Hasil Evaluasi Harga Penawaran E-Purchasing
     Header: Filter (Pejabat · RUP) · Aksi · Zoom
     ═══════════════════════════════════════════════════════════ -->

<div class="card" style="overflow:visible;">

  <!-- ── CARD HEADER ────────────────────────────────────────── -->
  <div class="card-header">
    <div class="card-title">📑 EV_HP - Berita Acara Hasil Evaluasi Harga Penawaran E-Purchasing</div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">

      <!-- Filter: Pejabat & RUP -->
      <select class="filter-select" id="evhp-pejabat-select" onchange="loadEvhpData()"
        title="Pilih Pejabat Pengadaan">
        <option value="">-- Pilih Pejabat Pengadaan --</option>
      </select>
      <select class="filter-select" id="evhp-rup-select" onchange="loadEvhpData()">
        <option value="">-- Pilih No RUP --</option>
      </select>

      <!-- Aksi: Cetak · PDF · Margin -->
      <button class="btn btn-primary" onclick="printEvhp()">🖨️ Cetak</button>
      <button class="btn-pdf" onclick="saveToPDF('evhp')"
        title="Buka dokumen siap simpan sebagai PDF">
        📄 PDF
      </button>
      <button class="btn" onclick="openMarginDialog('evhp','EV_HP')"
        title="Atur margin cetak"
        style="background:#f3f4f6; color:#111; border:1px solid #d0d7de;">
        ⚙️ Margin
      </button>

      <!-- Zoom: Preview -->
      <div style="display:flex; align-items:center; gap:4px;
                  border-left:1px solid #d0d7de; padding-left:8px; margin-left:2px;">
        <button onclick="docZoom('evhp',-10)" title="Perkecil"
          style="width:28px; height:28px; border-radius:6px; border:1px solid #d0d7de;
                 background:#f3f4f6; color:#111; font-size:15px; cursor:pointer;
                 display:flex; align-items:center; justify-content:center;">
          −
        </button>
        <span id="evhp-zoom-label"
          style="font-size:11px; font-weight:600; color:#374151;
                 min-width:34px; text-align:center;">
          100%
        </span>
        <button onclick="docZoom('evhp',10)" title="Perbesar"
          style="width:28px; height:28px; border-radius:6px; border:1px solid #d0d7de;
                 background:#f3f4f6; color:#111; font-size:15px; cursor:pointer;
                 display:flex; align-items:center; justify-content:center;">
          +
        </button>
        <button onclick="docZoomReset('evhp')" title="Reset zoom"
          style="height:28px; padding:0 7px; border-radius:6px; border:1px solid #d0d7de;
                 background:#f3f4f6; color:#111; font-size:11px; font-weight:600;
                 cursor:pointer;">
          Reset
        </button>
      </div>

    </div>
  </div>

  <!-- ── CARD BODY ──────────────────────────────────────────── -->
  <div class="card-body" id="evhp-content" style="overflow-x:auto; padding:0;">
    <div class="empty-state">
      <div class="empty-icon">📑</div>
      <div class="empty-title">Pilih No RUP</div>
      <div class="empty-sub">
        Pilih nomor RUP untuk menampilkan evaluasi harga penawaran
      </div>
    </div>
  </div>

</div>
