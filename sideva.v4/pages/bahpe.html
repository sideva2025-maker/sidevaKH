<!-- ═══════════════════════════════════════════════════════════
     BAHPE — Berita Acara Hasil Penetapan E-Purchasing
     Header: Filter (PPK · Pejabat · RUP) · Aksi · Zoom
     ═══════════════════════════════════════════════════════════ -->

<!-- Shared style singkat untuk label filter di halaman ini -->
<style>
  .flt-label {
    font-size:11px; font-weight:600; color:var(--text3);
    text-transform:uppercase; letter-spacing:0.5px;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .flt-label-hidden { font-size:11px; font-weight:600; color:transparent; }
  .zoom-btn {
    width:30px; height:30px; border-radius:6px; border:1px solid #d0d7de;
    background:#f3f4f6; color:#111; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .zoom-reset {
    height:30px; padding:0 8px; border-radius:6px; border:1px solid #d0d7de;
    background:#f3f4f6; color:#111; font-size:11px; font-weight:600;
    cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
  }
</style>

<div class="card" style="overflow:visible;">

  <!-- ── CARD HEADER ────────────────────────────────────────── -->
  <div class="card-header"
    style="flex-direction:column; align-items:flex-start; gap:14px; padding:20px 24px;">

    <div class="card-title"
      style="font-size:15px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif;">
      📋 BAHPE — Berita Acara Hasil Penetapan E-Purchasing
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; width:100%;">

      <!-- Filter: PPK / PPKom -->
      <div style="display:flex; flex-direction:column; gap:4px; flex:1; min-width:180px;">
        <span class="flt-label">PPK / PPKom</span>
        <select class="filter-select" id="bahpe-ppk-select" onchange="scheduleLoadBahpeData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih PPKom —</option>
        </select>
      </div>

      <!-- Filter: Pejabat Pengadaan -->
      <div style="display:flex; flex-direction:column; gap:4px; flex:1; min-width:180px;">
        <span class="flt-label">Pejabat Pengadaan</span>
        <select class="filter-select" id="bahpe-pejabat-select" onchange="scheduleLoadBahpeData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih Pejabat Pengadaan —</option>
        </select>
      </div>

      <!-- Filter: Nomor RUP -->
      <div style="display:flex; flex-direction:column; gap:4px; flex:1; min-width:160px;">
        <span class="flt-label">Nomor RUP</span>
        <select class="filter-select" id="bahpe-rup-select" onchange="scheduleLoadBahpeData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih No RUP —</option>
        </select>
      </div>

      <!-- Aksi: Cetak · PDF · Margin -->
      <div style="display:flex; flex-direction:column; gap:4px; justify-content:flex-end;">
        <span class="flt-label-hidden">‎</span>
        <button class="btn btn-primary" onclick="printBahpe()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; white-space:nowrap;">
          🖨️ Cetak
        </button>
        <button class="btn-pdf" onclick="saveToPDF('bahpe')"
          title="Buka dokumen siap simpan sebagai PDF">
          📄 PDF
        </button>
        <button class="btn" onclick="openMarginDialog('bahpe','BAHPE')"
          title="Atur margin cetak"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;
                 white-space:nowrap; background:#f3f4f6; color:#111; border:1px solid #d0d7de;">
          ⚙️ Margin
        </button>
      </div>

      <!-- Zoom: Preview -->
      <div style="display:flex; flex-direction:column; gap:4px; justify-content:flex-end;">
        <span class="flt-label">Zoom Preview</span>
        <div style="display:flex; align-items:center; gap:4px;">
          <button class="zoom-btn" onclick="bahpeZoom(-10)" title="Perkecil">−</button>
          <span id="bahpe-zoom-label"
            style="font-size:12px; font-weight:600; color:#374151;
                   min-width:38px; text-align:center;
                   font-family:'Plus Jakarta Sans',sans-serif;">
            100%
          </span>
          <button class="zoom-btn" onclick="bahpeZoom(10)"  title="Perbesar">+</button>
          <button class="zoom-reset" onclick="bahpeZoomReset()" title="Reset zoom">Reset</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── CARD BODY ──────────────────────────────────────────── -->
  <div class="card-body" id="bahpe-content" style="overflow-x:auto; padding:0;">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title" style="font-family:'Plus Jakarta Sans',sans-serif;">Pilih No RUP</div>
      <div class="empty-sub" style="font-family:'Plus Jakarta Sans',sans-serif;">
        Pilih PPKom, Pejabat Pengadaan, dan No RUP untuk menampilkan
        Berita Acara Hasil Penetapan E-Purchasing
      </div>
    </div>
  </div>

</div>
