<!-- ═══════════════════════════════════════════════════════════
     RIVIU — Berita Acara Reviu DPP E-Purchasing  v2.0
     Layout dirapikan: filter baris 1, aksi + zoom baris 2
     ═══════════════════════════════════════════════════════════ -->

<div class="card" style="overflow:visible;">

  <!-- ── CARD HEADER ────────────────────────────────────────── -->
  <div class="card-header doc-header">

    <!-- Judul -->
    <div class="doc-title">📝 Riviu — Berita Acara Reviu DPP E-Purchasing</div>

    <!-- Baris 1: Filter -->
    <div class="doc-filter-row">
      <div class="doc-flt-group">
        <span class="doc-flt-label">PPK / PPKom</span>
        <select class="filter-select" id="riviu-ppk-select" onchange="loadRiviuData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih PPKom —</option>
        </select>
      </div>
      <div class="doc-flt-group">
        <span class="doc-flt-label">Pejabat Pengadaan</span>
        <select class="filter-select" id="riviu-pejabat-select" onchange="loadRiviuData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih Pejabat Pengadaan —</option>
        </select>
      </div>
      <div class="doc-flt-group">
        <span class="doc-flt-label">Nomor RUP</span>
        <select class="filter-select" id="riviu-rup-select" onchange="loadRiviuData()"
          style="font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;">
          <option value="">— Pilih No RUP —</option>
        </select>
      </div>
    </div>

    <!-- Baris 2: Aksi + Zoom -->
    <div class="doc-action-row">
      <span class="doc-section-tag">Aksi:</span>
      <button class="btn btn-primary" onclick="printRiviu()"
        style="font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; height:32px; padding:0 14px;">
        🖨️ Cetak
      </button>
      <button class="btn-pdf" onclick="saveToPDF('riviu')"
        title="Buka dokumen siap simpan sebagai PDF"
        style="height:32px;">
        📄 PDF
      </button>
      <button class="btn-doc-margin" onclick="openMarginDialog('riviu','Riviu')" title="Atur margin cetak">
        ⚙️ Margin
      </button>

      <!-- Zoom -->
      <div class="doc-zoom-wrap">
        <span class="doc-section-tag">Zoom:</span>
        <button class="doc-zoom-btn" onclick="docZoom('riviu',-10)" title="Perkecil">−</button>
        <span id="riviu-zoom-label" class="doc-zoom-label">100%</span>
        <button class="doc-zoom-btn" onclick="docZoom('riviu',10)"  title="Perbesar">+</button>
        <button class="doc-zoom-reset" onclick="docZoomReset('riviu')" title="Reset zoom">Reset</button>
      </div>
    </div>

  </div>

  <!-- ── CARD BODY ──────────────────────────────────────────── -->
  <div class="card-body" id="riviu-content" style="overflow-x:auto; padding:0;">
    <div class="empty-state">
      <div class="empty-icon">📝</div>
      <div class="empty-title" style="font-family:'Plus Jakarta Sans',sans-serif;">Pilih No RUP</div>
      <div class="empty-sub" style="font-family:'Plus Jakarta Sans',sans-serif;">
        Pilih PPKom, Pejabat Pengadaan, dan No RUP untuk menampilkan Berita Acara Reviu DPP
      </div>
    </div>
  </div>

</div>
